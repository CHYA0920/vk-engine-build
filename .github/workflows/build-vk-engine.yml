name: Build Windows VK Engine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Checkout VK engine branch
        uses: actions/checkout@v4
        with:
          repository: sero583/flutter
          ref: impeller-vulkan-desktop
          fetch-depth: 1
      - name: Install depot_tools
        shell: pwsh
        run: git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
      - name: Patch depot_tools for system git
        shell: python
        run: |
          import pathlib, subprocess
          d = pathlib.Path(r"C:\depot_tools")
          subprocess.run(["git", "-C", str(d), "checkout", "--", "git_cache.py"], check=True)
          Remove = d / "git.bat"
          Remove.unlink(missing_ok=True)
          scm = d / "gclient_scm.py"
          lines = scm.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
          done = False
          for i, l in enumerate(lines):
              if "def cache_dir(self):" in l:
                  indent = l[:len(l) - len(l.lstrip())]
                  j = i + 1
                  while j < len(lines) and (lines[j].strip() == "" or len(lines[j]) - len(lines[j].lstrip()) > len(indent)):
                      j += 1
                  lines[i+1:j] = [indent + "    return None\n"]
                  done = True
                  break
          assert done, "cache_dir not found"
          scm.write_text("".join(lines), encoding="utf-8")
          print("cache_dir neutralized")
          bat = d / "git.bat"
          bat.write_text('@echo off\r\n@"C:\\Program Files\\Git\\cmd\\git.exe" %*\r\n', encoding="ascii")
          print("git.bat shim created")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "C:\depot_tools"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_UPDATE=0"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_WIN_TOOLCHAIN=0"
          Copy-Item engine\scripts\standard.gclient .gclient
      - name: gclient sync
        shell: pwsh
        run: gclient sync --no-history -j4 --nohooks
      - name: gn
        shell: pwsh
        run: |
          cd engine\src
          python flutter\tools\gn --unoptimized
      - name: ninja
        shell: pwsh
        run: |
          cd engine\src
          ninja -C out\host_debug_unopt
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: windows-vk-engine
          path: |
            engine/src/out/host_debug_unopt/flutter_windows.dll
            engine/src/out/host_debug_unopt/icudtl.dat
            engine/src/out/host_debug_unopt/flutter_tester.exe
