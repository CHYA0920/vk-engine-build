name: Build Windows VK Engine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Checkout VK engine branch
        uses: actions/checkout@v4
        with:
          repository: sero583/flutter
          ref: impeller-vulkan-desktop
          fetch-depth: 1
      - name: Install depot_tools
        shell: pwsh
        run: git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
      - name: Patch depot_tools for system git
        shell: python
        run: |
          import pathlib, re
          d = pathlib.Path(r"C:\depot_tools")
          for f in d.glob("*.py"):
              t = f.read_text(encoding="utf-8", errors="replace")
              orig = t
              t = t.replace("git_exe = 'git.bat' if sys.platform.startswith('win') else 'git'", "git_exe = 'git'")
              t = t.replace("'git.bat'", "'git'")
              if f.name == "git_cache.py":
                  t = re.sub(r"def GetCachePath\([^)]*\):", "def GetCachePath(*a, **k):\n  return None", t, count=1)
              if t != orig:
                  f.write_text(t, encoding="utf-8")
                  print("patched", f.name)
          gc = d / "git_cache.py"
          assert "return None" in gc.read_text(encoding="utf-8"), "git cache short-circuit missing"
          print("patch done")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "C:\depot_tools"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_UPDATE=0"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_WIN_TOOLCHAIN=0"
          Copy-Item engine\scripts\standard.gclient .gclient
      - name: gclient sync
        shell: pwsh
        run: gclient sync --no-history -j4
      - name: gn
        shell: pwsh
        run: |
          cd engine\src
          python flutter\tools\gn --unoptimized
      - name: ninja
        shell: pwsh
        run: |
          cd engine\src
          ninja -C out\host_debug_unopt
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: windows-vk-engine
          path: |
            engine/src/out/host_debug_unopt/flutter_windows.dll
            engine/src/out/host_debug_unopt/icudtl.dat
            engine/src/out/host_debug_unopt/flutter_tester.exe
