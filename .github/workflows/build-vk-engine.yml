name: Build Windows VK Engine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Checkout VK engine branch
        uses: actions/checkout@v4
        with:
          repository: sero583/flutter
          ref: impeller-vulkan-desktop
          fetch-depth: 1
      - name: Install depot_tools
        shell: pwsh
        run: git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
      - name: Patch depot_tools for system git
        shell: python
        run: |
          import pathlib, subprocess
          d = pathlib.Path(r"C:\depot_tools")
          subprocess.run(["git", "-C", str(d), "checkout", "--", "git_cache.py"], check=True)
          Remove = d / "git.bat"
          Remove.unlink(missing_ok=True)
          scm = d / "gclient_scm.py"
          lines = scm.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
          done = False
          for i, l in enumerate(lines):
              if "def cache_dir(self):" in l:
                  indent = l[:len(l) - len(l.lstrip())]
                  j = i + 1
                  while j < len(lines) and (lines[j].strip() == "" or len(lines[j]) - len(lines[j].lstrip()) > len(indent)):
                      j += 1
                  lines[i+1:j] = [indent + "    return None\n"]
                  done = True
                  break
      - name: Patch depot_tools for system git
        shell: python
        run: |
          import pathlib, subprocess
          d = pathlib.Path(r"C:\depot_tools")
          subprocess.run(["git", "-C", str(d), "checkout", "--", "git_cache.py"], check=True)
          Remove = d / "git.bat"
          Remove.unlink(missing_ok=True)
          scm = d / "gclient_scm.py"
          lines = scm.read_text(encoding="utf-8", errors="replace").splitlines(keepends=True)
          done = False
          for i, l in enumerate(lines):
              if "def cache_dir(self):" in l:
                  indent = l[:len(l) - len(l.lstrip())]
                  j = i + 1
                  while j < len(lines) and (lines[j].strip() == "" or len(lines[j]) - len(lines[j].lstrip()) > len(indent)):
                      j += 1
                  lines[i+1:j] = [indent + "    return None\n"]
                  done = True
                  break
          assert done, "cache_dir not found"
          scm.write_text("".join(lines), encoding="utf-8")
          print("cache_dir neutralized")
          bat = d / "git.bat"
          bat.write_text('@echo off\r\n@"C:\\Program Files\\Git\\cmd\\git.exe" %*\r\n', encoding="ascii")
          print("git.bat shim created")
          (d / "ninja.bat").unlink(missing_ok=True)
          (d / "ninja.exe").unlink(missing_ok=True)
          print("depot_tools ninja removed")
          st = pathlib.Path("engine/src/build/toolchain/win/setup_toolchain.py")
          t2 = st.read_text(encoding="utf-8")
          t2 = t2.replace("if not os.path.exists(part) and len(part) != 0:", "if False:")
          t2 = t2.replace("SDK_VERSION = '10.0.28000.0'", "SDK_VERSION = '10.0.26100.0'")
          st.write_text(t2, encoding="utf-8")
          print("setup_toolchain neutralized + SDK version pinned to 10.0.26100.0")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "C:\depot_tools"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_UPDATE=0"
          Add-Content $env:GITHUB_ENV "DEPOT_TOOLS_WIN_TOOLCHAIN=0"
          Copy-Item engine\scripts\standard.gclient .gclient
      - name: gclient sync
        shell: pwsh
        run: gclient sync --no-history -j4 --nohooks
      - name: Run dart package hooks manually
        shell: pwsh
        run: |
          python engine\src\flutter\third_party\dart\tools\generate_package_config.py
          python engine\src\flutter\tools\pub_get_offline.py
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install ninja
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile C:\ninja.zip
          Expand-Archive C:\ninja.zip C:\ninja-tools -Force
          Add-Content $env:GITHUB_PATH "C:\ninja-tools"
          ninja --version
      - name: gn
        shell: pwsh
        run: |
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Lib"
          $ver = (Get-ChildItem $sdkRoot -Directory -ErrorAction SilentlyContinue | Sort-Object Name | Select-Object -Last 1).Name
          Write-Host "SDK lib version found: $ver"
          if ($ver) {
            $env:LIB = "$sdkRoot\$ver\ucrt\x64;$sdkRoot\$ver\um\x64;" + $env:LIB
          }
          cd engine\src
          python flutter\tools\gn --unoptimized
          python -c "import pathlib,os; base=pathlib.Path('out/host_debug_unopt'); print('CWD:', os.getcwd()); sdk_root=pathlib.Path('C:/Program Files (x86)/Windows Kits/10/Lib'); print('SDK-LIB-DIRS:', [p.name for p in sdk_root.iterdir()] if sdk_root.exists() else 'NO-LIB-DIR'); um=(sdk_root/'10.0.26100.0/um/x64'); print('um-x64-exists:', um.exists(), 'advapi32:', (um/'advapi32.lib').exists()); raw=(base/'environment.x64').read_bytes(); d=raw.decode('utf-8'); import re as _re; d2=_re.sub(r'LIB=([^\x00]*)', lambda mm: 'LIB='+mm.group(1).replace('10.0.22621.0','10.0.26100.0').replace('\\\\','\\'), d); (base/'environment.x64').write_bytes(d2.encode('utf-8')); raw2=(base/'environment.x64').read_bytes(); parts=[x for x in raw2.decode('utf-8').split(chr(0)) if x.startswith('LIB=')]; print('FINAL-LIB:', parts[0][:600] if parts else 'MISSING')"  

      - name: ninja
        shell: pwsh
        run: |
          cd engine\src
          ninja -C out\host_debug_unopt
      - name: Upload engine
        uses: actions/upload-artifact@v4
        with:
          name: windows-vk-engine
          path: |
            engine/src/out/host_debug_unopt/flutter_windows.dll
            engine/src/out/host_debug_unopt/icudtl.dat
            engine/src/out/host_debug_unopt/flutter_tester.exe
